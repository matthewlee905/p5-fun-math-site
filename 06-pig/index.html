<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>第 6 節　豪賭客（Pig 骰子）</title>
<link rel="stylesheet" href="../css/common.css">
<style>
body{background:linear-gradient(#fff7ed,#ecfeff) fixed}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.board{grid-template-columns:1fr}}
.player{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);border:4px solid transparent;text-align:center}
.player.on{border-color:#f59e0b;background:#fffbeb}
.player h2{margin:0;font-size:24px}
.bag{font-size:16px;color:#6b7280}
.total{font-size:48px;font-weight:900;color:#b45309;line-height:1.1}
.turn{font-size:28px;font-weight:800;color:#0369a1}
.dice-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin:12px 0}
.die{width:120px;height:120px;min-height:120px;background:#fff;border-radius:24px;border:6px solid #7dd3fc;box-shadow:0 6px 0 #0284c7;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:6px}
.die.shake{animation:shake .35s linear}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.pip{width:100%;height:100%;border-radius:50%;background:transparent}
.pip.on{background:#0f172a}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ctrl .btn{min-width:140px;min-height:60px;font-size:22px}
.log{max-height:260px;overflow:auto;font-size:16px}
.log li{margin:4px 0}
.setrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.setrow select,.setrow input{min-height:48px;width:auto;display:inline-block}
.pig{font-size:42px}
</style>
</head>
<body>
<noscript><div class="noscript">請用 Safari 打開這個檔案（不要只在對話預覽裡觀看）。本遊戲需要瀏覽器執行。</div></noscript>
<div class="app">
  <div class="topbar">
    <a class="back" href="../index.html">← 返回總覽</a>
    <div class="brand"><h1><span class="lesson">第 6 節</span>豪賭客（Pig 骰子）</h1></div>
  </div>
  <div class="learn-goal" role="note">
    <div class="lab">🎯 學習目標</div>
    <p>我能夠比較「再擲」和「停手把分數入袋」兩種選擇的得失，並根據本輪分數和紀錄，思考什麼時候該停。</p>
  </div>
  <div class="mission">
    <div class="lab">任務目的</div>
    <p>① 輪流擲骰子：可以再擲，或停手把本輪分數放入分數袋。<br>② 如果擲到 1，本輪分數會全部清掉。<br>③ 誰先到達目標分數（預設 50 分）就算完成。支援層本輪到 15 分就必須停。</p>
  </div>
  <div class="levels">
    <button class="lv on" data-l="support">🌱 支援（到 15 必須停）</button>
    <button class="lv" data-l="basic">⭐ 基本（到 20 可選必須停）</button>
    <button class="lv" data-l="challenge">🔥 挑戰（比較兩種停手規則）</button>
  </div>
  <div class="panel setrow">
    <label>目標分數
      <select id="goal"><option value="50" selected>50</option><option value="30">30</option><option value="100">100</option></select>
    </label>
    <label>必須停手門檻
      <select id="mustHold">
        <option value="0">不強制</option>
        <option value="15">本輪到 15 必須停</option>
        <option value="20">本輪到 20 必須停</option>
      </select>
    </label>
    <label>對手
      <select id="opp">
        <option value="friend" selected>同機兩人對戰</option>
        <option value="solo">只記錄自己練習</option>
        <option value="cpu">可選：對簡單電腦（到 20 停）</option>
      </select>
    </label>
    <button class="btn btn-ghost" id="newBtn">開新一局</button>
    <button class="btn btn-ghost" id="compareBtn">挑戰：比較兩種停手規則</button>
  </div>

  <div class="board">
    <div class="player on" id="p0"><span class="pig" aria-hidden="true">🐷</span><h2 id="n0">同學 A</h2>
      <div class="bag">分數袋</div><div class="total" id="t0">0</div>
      <div>本輪暫存</div><div class="turn" id="u0">0</div>
    </div>
    <div class="player" id="p1"><span class="pig" aria-hidden="true">🐷</span><h2 id="n1">同學 B</h2>
      <div class="bag">分數袋</div><div class="total" id="t1">0</div>
      <div>本輪暫存</div><div class="turn" id="u1">0</div>
    </div>
  </div>

  <div class="panel">
    <div class="dice-area">
      <div class="die" id="die" aria-label="骰子"></div>
      <div class="msg" id="fb">輪到同學 A：可以按「再擲」，或把本輪分數放入分數袋。</div>
      <div class="ctrl">
        <button class="btn btn-blue" id="rollBtn">🎲 再擲</button>
        <button class="btn btn-yellow" id="holdBtn">👜 停手，放入分數袋</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>擲／停紀錄</h2>
    <ol class="log" id="log"></ol>
  </div>

  <footer class="teacher-entry"><button class="tbtn" id="teacherBtn">老師說明</button></footer>
</div>
<div class="overlay hidden" id="ov"><div class="card" id="ovCard"></div></div>
<script src="../js/common.js"></script>
<script>
const PIP=[[], [4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const state={
  level:"support",goal:50,mustHold:15,opp:"friend",
  tot:[0,0],turn:0,cur:0,over:false,log:[],last:null,busy:false
};

function nameOf(i){
  if(state.opp==="solo") return i===0?"練習者":"（此模式只有一人）";
  if(state.opp==="cpu") return i===0?"同學":"電腦（到 20 停）";
  return i===0?"同學 A":"同學 B";
}

function drawDie(n){
  const d=$("die");d.innerHTML="";
  for(let i=0;i<9;i++){
    const s=document.createElement("i");s.className="pip"+(n&&PIP[n].indexOf(i)!==-1?" on":"");d.appendChild(s);
  }
}
function log(msg){
  state.log.unshift(msg);
  const el=$("log");el.innerHTML=state.log.map(x=>`<li>${x}</li>`).join("");
}
function render(){
  $("n0").textContent=nameOf(0);$("n1").textContent=nameOf(1);
  $("t0").textContent=state.tot[0];$("t1").textContent=state.tot[1];
  $("u0").textContent=state.cur===0?state.turn:0;$("u1").textContent=state.cur===1?state.turn:0;
  $("p0").classList.toggle("on",!state.over&&state.cur===0);
  $("p1").classList.toggle("on",!state.over&&state.cur===1);
  $("p1").style.display=state.opp==="solo"?"none":"";
  const must=state.mustHold>0&&state.turn>=state.mustHold;
  $("rollBtn").disabled=state.over||state.busy||must||(state.opp==="cpu"&&state.cur===1);
  $("holdBtn").disabled=state.over||state.busy||state.turn===0||(state.opp==="cpu"&&state.cur===1);
  if(state.over) return;
  if(must) $("fb").textContent=`本輪已有 ${state.turn} 分，達到「到 ${state.mustHold} 必須停」的設定，請放入分數袋。`;
}

function newGame(){
  state.goal=+$("goal").value;
  state.mustHold=+$("mustHold").value;
  state.opp=$("opp").value;
  state.tot=[0,0];state.turn=0;state.cur=0;state.over=false;state.log=[];state.last=null;state.busy=false;
  $("log").innerHTML="";drawDie(null);
  $("fb").className="msg";
  $("fb").textContent=`新一局：先到 ${state.goal} 分。輪到 ${nameOf(0)}。課名只是趣味包裝，這裡沒有金錢或獎品。`;
  log(`新一局開始，目標 ${state.goal} 分${state.mustHold?`，本輪到 ${state.mustHold} 必須停`:""}。`);
  render();
}

function nextPlayer(){
  state.turn=0;
  if(state.opp==="solo"){state.cur=0;render();return;}
  state.cur=1-state.cur;
  render();
  $("fb").className="msg";
  $("fb").textContent=`輪到 ${nameOf(state.cur)}。`;
  if(state.opp==="cpu"&&state.cur===1&&!state.over) setTimeout(cpuPlay,600);
}

function rollValue(){return 1+Math.floor(Math.random()*6);}

function applyRoll(n){
  state.last=n;drawDie(n);
  $("die").classList.remove("shake");void $("die").offsetWidth;$("die").classList.add("shake");
  const who=nameOf(state.cur);
  if(n===1){
    log(`${who} 擲到 1。本輪暫存 ${state.turn} 分全部歸零，換人。`);
    $("fb").className="msg warn";
    $("fb").textContent=`擲到 1！本輪 ${state.turn} 分沒有了。換下一個人。`;
    state.turn=0;render();
    setTimeout(nextPlayer,700);
  }else{
    state.turn+=n;
    log(`${who} 擲到 ${n}，本輪暫存現在有 ${state.turn} 分。（分數袋仍是 ${state.tot[state.cur]}）`);
    $("fb").className="msg";
    $("fb").textContent=`擲到 ${n}。本輪暫存 ${state.turn} 分。再擲可能更高，但也有機會擲到 1 而全部失去。`;
    render();
  }
}

function doRoll(){
  if(state.over||state.busy) return;
  if(state.mustHold>0&&state.turn>=state.mustHold) return;
  state.busy=true;$("rollBtn").disabled=true;$("holdBtn").disabled=true;
  let t=0,times=8;
  const iv=setInterval(()=>{drawDie(1+Math.floor(Math.random()*6));t++;
    if(t>=times){clearInterval(iv);applyRoll(rollValue());state.busy=false;render();}
  },70);
}

function doHold(){
  if(state.over||state.busy||state.turn===0) return;
  const who=nameOf(state.cur);
  state.tot[state.cur]+=state.turn;
  log(`${who} 選擇停手，把 ${state.turn} 分放入分數袋。分數袋現在有 ${state.tot[state.cur]} 分。`);
  $("fb").className="msg ok";
  $("fb").textContent=`${who} 把 ${state.turn} 分穩穩放進分數袋。現在袋裡有 ${state.tot[state.cur]} 分。`;
  state.turn=0;
  if(state.tot[state.cur]>=state.goal){
    state.over=true;render();
    $("fb").className="msg ok";
    $("fb").textContent=`${who} 先到 ${state.goal} 分！回看紀錄，找一找「該考慮停」的時刻。這節和真賭博無關。`;
    log(`${who} 先到目標 ${state.goal} 分。`);
    return;
  }
  nextPlayer();
}

function cpuPlay(){
  if(state.over||state.cur!==1) return;
  // 簡單策略：本輪到 20 或已足夠過線就停；否則再擲
  const need=state.goal-state.tot[1];
  if(state.turn>=20 || (state.turn>0&&state.turn>=need) || (state.mustHold&&state.turn>=state.mustHold)){
    doHold();
  }else{
    doRoll();
    const wait=()=>{if(state.busy){setTimeout(wait,80);return;}
      if(state.cur===1&&!state.over) setTimeout(cpuPlay,650);
    };setTimeout(wait,400);
  }
}

function setLevel(l){
  state.level=l;
  document.querySelectorAll(".lv").forEach(x=>x.classList.toggle("on",x.dataset.l===l));
  $("goal").value="50";
  if(l==="support") $("mustHold").value="15";
  else if(l==="basic") $("mustHold").value="20";
  else $("mustHold").value="0";
  $("opp").value="friend";
  newGame();
}
document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>setLevel(b.dataset.l));
$("rollBtn").onclick=doRoll;$("holdBtn").onclick=doHold;$("newBtn").onclick=newGame;
$("goal").onchange=$("mustHold").onchange=$("opp").onchange=newGame;

$("compareBtn").onclick=()=>{
  openCard(`<h2>比較兩種停手規則</h2>
    <p>挑戰層建議：各玩一短局（目標可改 30 分）。一局用「本輪到 10 就停」，另一局用「到 20 才停」。不用公式，只要描述你的感覺：哪一種較常保住分數？樣本很小，只作感受。</p>
    <div class="btn-row">
      <button class="btn btn-blue" id="c10">用「到 10 必須停」開短局</button>
      <button class="btn btn-yellow" id="c20">用「到 20 必須停」開短局</button>
      <button class="btn" id="cNo">取消</button>
    </div>`);
  $("c10").onclick=()=>{$("goal").value="30";$("mustHold").value="10";closeCard();newGame();};
  $("c20").onclick=()=>{$("goal").value="30";$("mustHold").value="20";closeCard();newGame();};
  $("cNo").onclick=closeCard;
};
$("teacherBtn").onclick=()=>{
  openCard(`<div class="teacher"><h2>老師說明　第 6 節</h2>
  <h3>學習目標</h3>
  <p>學生頁：『我能夠比較「再擲」和「停手把分數入袋」兩種選擇的得失，並根據本輪分數和紀錄，思考什麼時候該停。』</p>
  <h3>任務目的（學生頁）</h3>
  <p>① 輪流擲骰子：可以再擲，或停手把本輪分數放入分數袋。<br>② 如果擲到 1，本輪分數會全部清掉。<br>③ 誰先到達目標分數（預設 50 分）就算完成。支援層本輪到 15 分就必須停。</p>
  <ul><li>先玩，再談「為什麼有時該停」：再擲可能更高，也可能失去本輪分數。</li>
  <li>用紀錄比較「常常再擲」和「到某個分數就停」，不教期望值公式。</li>
  <li>課名只是趣味包裝：不用真錢、不兌換獎品、畫面避免賭場風格。</li></ul>
  <h3>分層</h3>
  <ul><li>支援：目標 50，到 15 必須停；優先同機雙人，或改用實體骰子。</li>
  <li>基本：至少 1 局完整對打，有擲／停紀錄，能說出一個該考慮停的時刻。可選到 20 必須停。</li>
  <li>挑戰：比較「10 分停」與「20 分停」各一短局；或討論自己快到目標時要不要更保守。</li></ul>
  <p>電腦對手只是可選，不要強迫使用。實體骰子仍建議備着。</p>
  <div class="btn-row"><button class="btn" id="tClose">關閉</button></div></div>`);
  $("tClose").onclick=closeCard;
};
drawDie(null);setLevel("support");
if(isTeacherMode()) $("teacherBtn").click();
</script>
</body>
</html>
