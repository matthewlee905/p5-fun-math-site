<script>
/* ============================================================
   地圖資料
   每幅地圖保留原有圖論結構（由下方格子定義產生，再固化成明確的
   adjacency 列表）。相鄰＝共邊；只接角不算。格子只用來產生曲線
   邊界與鄰接表，畫面改畫成不規則／曲線多邊形，不再顯示方塊格。
   χ 只供老師說明與自測，不在學生畫面顯示。
   ============================================================ */
const RAW_MAPS=[
 {id:'s1',level:'support',name:'棋盤六國',chi:2,rows:[
 'AAAABBBBCCCC','AAAABBBBCCCC','AAAABBBBCCCC','DDDDEEEEFFFF','DDDDEEEEFFFF','DDDDEEEEFFFF']},
 {id:'s2',level:'support',name:'回字城堡',chi:2,rows:[
 'AAAAAAAAAAAA','ABBBBBBBBBBA','ABCCCCCCCCBA','ABCDDDDDDCBA','ABCCCCCCCCBA','ABBBBBBBBBBA','AAAAAAAAAAAA']},
 {id:'s3',level:'support',name:'三角小島',chi:3,rows:[
 'AAAABBBBEE','AAAABBBBEE','AAAABBBBEE','CCCCCCCCEE','CCCCCCCCEE','DDDDDDDDDD']},
 {id:'s4',level:'support',name:'花朵村',chi:3,rows:[
 'AAAAABBBBB','AAAAABBBBB','AAAEEEEBBB','DDDEEEECCC','DDDDDCCCCC','DDDDDCCCCC']},
 {id:'b1',level:'basic',name:'環湖五村',chi:3,rows:[
 'AAAAABBBBB','AA......BB','EE......CC','EE......CC','EEEDDDDDCC']},
 {id:'b2',level:'basic',name:'磚牆小屋',chi:3,rows:[
 'AAAABBBBCCCC','DDEEEEFFFFGG','HHHHIIIIJJJJ','KKLLLLMMMMNN']},
 {id:'b3',level:'basic',name:'四國相連',chi:4,rows:[
 'AAAAAABBBBBBFF','AAAAAABBBBBBFF','AAAADDDDBBBBFF','AAAADDDDBBBBFF','CCCCDDDDCCCCFF','CCCCCCCCCCCCFF','EEEEEEEEEEEEEE']},
 {id:'b4',level:'basic',name:'五瓣花',chi:4,rows:[
 'AAAAABBBBB','AAAAABBBBB','AAAFFFFBBB','EEEFFFFCCC','EEEFFFFCCC','EEEDDDDCCC','EEEDDDDCCC']},
 {id:'c1',level:'challenge',name:'大城小巷',chi:4,rows:[
 'AAAABBBBBCCCCC','AAAABBBBBCCCCC','AAGGGGBBHHHCCC','DDGGGGIIHHHCCC','DDGGGGIIHHHJJJ','DDDKKKIIIIIJJJ','EEEKKKKKLLLJJJ','EEEEEFFFLLLJJJ','EEEEEFFFFFFJJJ']},
 {id:'c2',level:'challenge',name:'蜂巢王國',chi:3,rows:[
 'AAAABBBBCCCCDD','EEFFFFGGGGHHHH','IIIIJJJJKKKKLL','MMNNNNOOOOPPPP','QQQQRRRRSSSSTT']},
 {id:'c3',level:'challenge',name:'寶石群島',chi:4,rows:[
 '..AAAA..BBBBB.','.AAAAAA.BBBBBB','.AAKKKKKKBBBB.','GGGKKXXXKKHHH.','GGGLLXXXMMHHH.','GGGLLXXXMMHHH.','..GLLNNOMMHH..','..IIINNOOJJJ..','..IIII..JJJJ..']},
 {id:'c4',level:'challenge',name:'切切切餅乾',chi:2,rows:[
 'AAAABBBBCCCCCC','AAAABBBBCCCCCC','AAAABDDDEEECCC','FFFFDDDDEEECCC','FFFFDDDDEEEEEE','FFFFDDDDDDEEEE','GGGGHHDDDDEEEE','GGGGHHHHHHIIII','GGGGHHHHHHIIII']}
];
const LEVELS={support:'🌱 支援',basic:'⭐ 基本',challenge:'🔥 挑戰'};
const PALETTE=[
 {c:'#ff6b6b',n:'紅'},{c:'#ffa94d',n:'橙'},{c:'#ffe066',n:'黃'},{c:'#69db7c',n:'綠'},
 {c:'#4dabf7',n:'藍'},{c:'#b197fc',n:'紫'},{c:'#f783ac',n:'粉紅'},{c:'#c08a5b',n:'棕'}
];
const UNCOLORED='#ffd8a8';

/* ---------- 由原圖格子產生明確鄰接表與曲線路徑（執行期只使用固化結果） ---------- */
function cellAt(rows,x,y){
  if(y<0||x<0||y>=rows.length||x>=rows[0].length) return '.';
  return rows[y][x];
}
function fmt(n){return Math.round(n*1000)/1000;}
function ptKey(x,y){return x+','+y;}
function uhash(x1,y1,x2,y2){
  let a=x1,b=y1,c=x2,d=y2;
  if(c<a||(c===a&&d<b)){a=x2;b=y2;c=x1;d=y1;}
  let h=(Math.imul(a+1,374761393)+Math.imul(b+3,668265263)+Math.imul(c+5,1274126177)+Math.imul(d+7,1103515245))>>>0;
  h=Math.imul(h^(h>>>16),2246822519)>>>0;
  return (h%10000)/10000;
}
function bulge(x1,y1,x2,y2){
  /* 控制點必須與邊的方向無關，否則相鄰兩區會各往相反方向鼓起，中間出現空隙。 */
  let a=x1,b=y1,c=x2,d=y2;
  if(c<a||(c===a&&d<b)){a=x2;b=y2;c=x1;d=y1;}
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=c-a,dy=d-b;
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const r=uhash(x1,y1,x2,y2);
  const amp=0.18+r*0.14;
  const sign=r>=0.5?1:-1;
  return [mx+nx*amp*sign,my+ny*amp*sign];
}
function gridAdj(rows){
  const H=rows.length,W=rows[0].length,sets={};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const a=rows[y][x];if(a!=='.') sets[a]=sets[a]||new Set();
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const a=rows[y][x];
    for(const [dx,dy] of [[1,0],[0,1]]){
      const nx=x+dx,ny=y+dy;if(nx>=W||ny>=H) continue;
      const b=rows[ny][nx];
      if(a!==b && a!=='.' && b!=='.'){sets[a].add(b);sets[b].add(a);}
    }
  }
  const adj={};
  Object.keys(sets).sort().forEach(a=>{adj[a]=[...sets[a]].sort();});
  return adj;
}
function regionLoops(rows,R){
  const H=rows.length,W=rows[0].length;
  const edges=new Map();
  function add(x1,y1,x2,y2){
    const k=ptKey(x1,y1);
    if(!edges.has(k)) edges.set(k,[]);
    edges.get(k).push({x1,y1,x2,y2});
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(cellAt(rows,x,y)!==R) continue;
    if(cellAt(rows,x,y-1)!==R) add(x,y,x+1,y);
    if(cellAt(rows,x+1,y)!==R) add(x+1,y,x+1,y+1);
    if(cellAt(rows,x,y+1)!==R) add(x+1,y+1,x,y+1);
    if(cellAt(rows,x-1,y)!==R) add(x,y+1,x,y);
  }
  const used=new Set();
  const eid=e=>e.x1+','+e.y1+'>'+e.x2+','+e.y2;
  const loops=[];
  for(const list of edges.values()){
    for(const start of list){
      if(used.has(eid(start))) continue;
      const loop=[start];used.add(eid(start));
      let cur=start,guard=0;
      while(guard++<20000){
        const nexts=edges.get(ptKey(cur.x2,cur.y2))||[];
        const nxt=nexts.find(e=>!used.has(eid(e)));
        if(!nxt) break;
        loop.push(nxt);used.add(eid(nxt));cur=nxt;
        if(cur.x2===start.x1&&cur.y2===start.y1) break;
      }
      const last=loop[loop.length-1];
      if(last.x2!==start.x1||last.y2!==start.y1) throw new Error('Unclosed loop '+R);
      loops.push(loop);
    }
  }
  return loops;
}
function loopToPath(loop){
  let d='M'+fmt(loop[0].x1)+' '+fmt(loop[0].y1);
  for(const e of loop){
    const [mx,my]=bulge(e.x1,e.y1,e.x2,e.y2);
    d+='Q'+fmt(mx)+' '+fmt(my)+' '+fmt(e.x2)+' '+fmt(e.y2);
  }
  return d+'Z';
}
function chainSegs(uniq){
  const by=new Map();
  function addV(x,y,e){const k=ptKey(x,y);if(!by.has(k)) by.set(k,[]);by.get(k).push(e);}
  for(const e of uniq){addV(e.x1,e.y1,e);addV(e.x2,e.y2,e);}
  const used=new Set();
  const id=e=>e.x1+','+e.y1+'-'+e.x2+','+e.y2;
  const paths=[];
  for(const e0 of uniq){
    if(used.has(id(e0))) continue;
    const chain=[e0];used.add(id(e0));
    function extend(fwd){
      while(true){
        const last=fwd?chain[chain.length-1]:chain[0];
        const ex=fwd?last.x2:last.x1,ey=fwd?last.y2:last.y1;
        const cands=(by.get(ptKey(ex,ey))||[]).filter(e=>!used.has(id(e)));
        if(cands.length!==1) return;
        const e=cands[0];used.add(id(e));
        const oriented=(e.x1===ex&&e.y1===ey)?e:{x1:e.x2,y1:e.y2,x2:e.x1,y2:e.y1};
        if(fwd) chain.push(oriented); else chain.unshift(oriented);
      }
    }
    extend(true);extend(false);
    let d='M'+fmt(chain[0].x1)+' '+fmt(chain[0].y1);
    for(const e of chain){
      const [mx,my]=bulge(e.x1,e.y1,e.x2,e.y2);
      d+='Q'+fmt(mx)+' '+fmt(my)+' '+fmt(e.x2)+' '+fmt(e.y2);
    }
    paths.push(d);
  }
  return paths;
}
function sharedBoundaries(rows,a,b){
  const H=rows.length,W=rows[0].length,segs=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=cellAt(rows,x,y);
    if(c!==a&&c!==b) continue;
    const r=cellAt(rows,x+1,y);
    if((c===a&&r===b)||(c===b&&r===a)) segs.push({x1:x+1,y1:y,x2:x+1,y2:y+1});
    const d=cellAt(rows,x,y+1);
    if((c===a&&d===b)||(c===b&&d===a)) segs.push({x1:x,y1:y+1,x2:x+1,y2:y+1});
  }
  const seen=new Set(),uniq=[];
  for(const e of segs){
    const k=[e.x1,e.y1,e.x2,e.y2].join(','),k2=[e.x2,e.y2,e.x1,e.y1].join(',');
    if(seen.has(k)||seen.has(k2)) continue;
    seen.add(k);uniq.push(e);
  }
  return chainSegs(uniq);
}
function regionCentre(rows,r){
  /* 選一個確實屬於該區、且盡量靠內部的格子中心，避免環形區的平均中心落在空洞，或點落在邊界上。 */
  const H=rows.length,W=rows[0].length;
  let best=null,bestN=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(rows[y][x]!==r) continue;
    let k=0,k8=0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const xx=x+dx,yy=y+dy;
      if(yy>=0&&yy<H&&xx>=0&&xx<W&&rows[yy][xx]===r) k++;
    }
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const xx=x+dx,yy=y+dy;
      if(yy>=0&&yy<H&&xx>=0&&xx<W&&rows[yy][xx]===r) k8++;
    }
    const score=k*10+k8;
    if(score>bestN){bestN=score;best=[x+.5,y+.5];}
  }
  return best||[0,0];
}
function buildMap(raw){
  const rows=raw.rows,H=rows.length,W=rows[0].length;
  const adj=gridAdj(rows);
  const regions=Object.keys(adj);
  const paths={},centres={},shared={};
  regions.forEach(r=>{
    const loops=regionLoops(rows,r);
    if(!loops.length) throw new Error(raw.id+' missing path for '+r);
    paths[r]=loops.map(loopToPath).join('');
    centres[r]=regionCentre(rows,r);
  });
  regions.forEach(a=>{
    adj[a].forEach(b=>{
      if(a<b) shared[a+'|'+b]=sharedBoundaries(rows,a,b);
    });
  });
  return {id:raw.id,level:raw.level,name:raw.name,chi:raw.chi,W,H,adj,paths,centres,shared,regions};
}

const MAPS=RAW_MAPS.map(buildMap);

/* ---------- 數學核心：著色色數（只用明確 adj 列表） ---------- */
function isSymmetric(adj){
  for(const a in adj) for(const b of adj[a]) if(!adj[b]||adj[b].indexOf(a)===-1) return false;
  return true;
}
function kColourable(adj,k){
  const vs=Object.keys(adj).sort((p,q)=>adj[q].length-adj[p].length),col={};
  const go=i=>{
    if(i===vs.length) return true;
    const v=vs[i];
    for(let c=0;c<k;c++){
      let ok=true;
      for(const u of adj[v]) if(col[u]===c){ok=false;break;}
      if(ok){col[v]=c;if(go(i+1)) return true;delete col[v];}
    }
    return false;
  };
  return go(0);
}
function chromatic(adj){for(let k=1;k<=8;k++) if(kColourable(adj,k)) return k;return 99;}
function selfTest(){
  return MAPS.map(m=>{
    const hasPath=m.regions.every(r=>m.paths[r]&&m.paths[r].indexOf('Q')!==-1&&m.paths[r].indexOf('Z')!==-1);
    const sym=isSymmetric(m.adj);
    const chi=chromatic(m.adj);
    return {id:m.id,name:m.name,level:m.level,regions:m.regions.length,declared:m.chi,computed:chi,symmetric:sym,hasPath,ok:hasPath&&sym&&chi===m.chi};
  });
}
const TEST=selfTest();
if(TEST.some(t=>!t.ok)) console.error('地圖自測失敗',TEST); else console.log('地圖自測全部通過',TEST);

/* ---------- 狀態（只存在記憶體，不收集任何資料） ---------- */
const state={level:'support',map:null,colour:{},pick:0,best:{},hintRegion:null};
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

function viewBoxOf(m){
  const pad=0.65;
  return {x:-pad,y:-pad,w:m.W+pad*2,h:m.H+pad*2};
}
function applySvgSize(s,m,minH){
  const vb=viewBoxOf(m);
  s.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  s.setAttribute('width', String(Math.round(vb.w*40)));
  s.setAttribute('height', String(Math.round(vb.h*40)));
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  s.style.aspectRatio = vb.w+' / '+vb.h;
  s.style.width='100%';
  s.style.height='auto';
  s.style.minHeight=(minH||260)+'px';
  s.style.maxHeight='70vh';
}

function drawThumb(m){
  const vb=viewBoxOf(m);
  const s=el('svg',{viewBox:vb.x+' '+vb.y+' '+vb.w+' '+vb.h,width:String(Math.round(vb.w*8)),height:String(Math.round(vb.h*8)),preserveAspectRatio:'xMidYMid meet'});
  s.style.aspectRatio=vb.w+' / '+vb.h;
  s.style.background='#d0ebff';
  m.regions.forEach(r=>{
    s.appendChild(el('path',{d:m.paths[r],fill:UNCOLORED,stroke:'#1c1e2e','stroke-width':'0.16','stroke-linejoin':'round', 'fill-rule':'evenodd'}));
  });
  return s;
}

function renderLevels(){
  document.querySelectorAll('.lv[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===state.level));
  const list=$('mapList');list.innerHTML='';
  MAPS.filter(m=>m.level===state.level).forEach((m,i)=>{
    const b=document.createElement('button');b.className='mc'+(state.map&&state.map.id===m.id?' on':'');
    b.appendChild(drawThumb(m));
    const t=document.createElement('div');t.textContent=`${i+1}. ${m.name}`;b.appendChild(t);
    if(state.best[m.id]){const d=document.createElement('div');d.className='done';d.textContent=`✓ 你用過 ${state.best[m.id]} 種`;b.appendChild(d);}
    b.onclick=()=>loadMap(m);list.appendChild(b);
  });
}
function renderPalette(){
  const p=$('palette');p.innerHTML='';
  PALETTE.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(state.pick===i?' on':'');b.style.background=c.c;b.textContent=c.n;b.setAttribute('aria-label',c.n);
    b.onclick=()=>{state.pick=i;renderPalette();};p.appendChild(b);});
  const e=document.createElement('button');e.className='sw eraser'+(state.pick===-1?' on':'');e.textContent='🧽 橡皮擦';
  e.onclick=()=>{state.pick=-1;renderPalette();};p.appendChild(e);
}

function loadMap(m){
  state.map=m;state.colour={};state.hintRegion=null;
  if(state.level!==m.level) state.level=m.level;
  const idx=MAPS.filter(x=>x.level===m.level).indexOf(m)+1;
  $('mapTitle').textContent=`${LEVELS[m.level]} 第 ${idx} 幅：${m.name}`;
  setMsg('② 點地圖上的區域著色。用同一種顏色再點一次，可以清除。');
  renderLevels();drawMap();
}

function drawMap(){
  const m=state.map,s=$('map');
  s.innerHTML='';
  applySvgSize(s,m,260);
  const wrap=$('mapWrap');
  if(wrap){
    const vb=viewBoxOf(m);
    wrap.style.aspectRatio=vb.w+' / '+vb.h;
    wrap.style.minHeight='260px';
  }
  // 海（背景已是海色；再鋪一塊以保證點選範圍清楚）
  const vb=viewBoxOf(m);
  s.appendChild(el('rect',{x:vb.x,y:vb.y,width:vb.w,height:vb.h,fill:'#d0ebff'}));
  m.regions.forEach(r=>{
    const c=state.colour[r];
    const p=el('path',{d:m.paths[r],class:'region','data-r':r,fill:c!==undefined?PALETTE[c].c:UNCOLORED,'fill-rule':'evenodd'});
    p.style.strokeWidth='2.4';
    p.style.vectorEffect='non-scaling-stroke';
    p.addEventListener('click',()=>tapRegion(r));
    s.appendChild(p);
  });
  // 未著色區域加小圓點，方便看出要著色
  m.regions.forEach(r=>{
    if(state.colour[r]===undefined){
      const [cx,cy]=m.centres[r];
      s.appendChild(el('circle',{cx:fmt(cx),cy:fmt(cy),r:.16,fill:'#8b8173','pointer-events':'none'}));
    }
  });
  const conf=conflicts();
  // 衝突邊（共用曲線邊界）
  const cg=el('g',{'pointer-events':'none'});
  conf.forEach(([a,b])=>{
    const key=a<b?a+'|'+b:b+'|'+a;
    (m.shared[key]||[]).forEach(d=>cg.appendChild(el('path',{d,class:'conf-line'})));
  });
  s.appendChild(cg);
  // 提示高亮
  if(state.hintRegion){
    const hg=el('g',{'pointer-events':'none'});
    hg.appendChild(el('path',{d:m.paths[state.hintRegion],class:'pulse-outline','fill-rule':'evenodd'}));
    s.appendChild(hg);
  }
  updateStatus(conf);
}
function conflicts(){
  const out=[],m=state.map,a=m.adj;
  for(const r in a) for(const n of a[r]) if(r<n&&state.colour[r]!==undefined&&state.colour[r]===state.colour[n]) out.push([r,n]);
  return out;
}
function usedColours(){return [...new Set(Object.values(state.colour))].sort((p,q)=>p-q);}

function tapRegion(r){
  state.hintRegion=null;
  if(state.pick===-1||state.colour[r]===state.pick) delete state.colour[r];
  else state.colour[r]=state.pick;
  drawMap();
  const conf=conflicts(),total=state.map.regions.length,done=Object.keys(state.colour).length;
  if(conf.length) setMsg('🙂 看看紅色虛線：那條邊兩旁的顏色一樣喔，換一換其中一區吧。','warn');
  else if(done===total) finish();
  else setMsg(`很好！還有 ${total-done} 個區域未著色。`);
}

function updateStatus(conf){
  const u=usedColours();$('nUsed').textContent=u.length;
  const d=$('usedDots');d.innerHTML='';u.forEach(i=>{const e=document.createElement('i');e.style.background=PALETTE[i].c;d.appendChild(e);});
  const total=state.map.regions.length,done=Object.keys(state.colour).length;
  $('prog').textContent=`已著色 ${done} / ${total} 個區域`+(conf&&conf.length?`　｜　相鄰同色：${conf.length} 處`:'');
}
function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'');}

function finish(){
  const m=state.map,n=usedColours().length;
  state.best[m.id]=Math.min(state.best[m.id]||99,n);
  renderLevels();confetti();
  setMsg(`🎉 完成！你這次用了 ${n} 種顏色。`);
  openCard(`<h2>🎉 完成了！</h2>
   <p>你這次用了 <span class="big-n">${n}</span> 種顏色完成！</p>
   <p>做得好！若想再挑戰，可以試試能不能用更少顏色再著一次。</p>
   <div class="row"><button class="btn clear big" id="cRetry">🔄 再試一次（清除顏色）</button>
   <button class="btn next big" id="cNext">➡️ 下一幅</button></div>`);
  $('cRetry').onclick=()=>{closeCard();clearMap();};
  $('cNext').onclick=()=>{closeCard();nextMap();};
}
function clearMap(){state.colour={};state.hintRegion=null;drawMap();setMsg('已清除。再試一次吧！可以試試用更少的顏色。');}
function nextMap(){const i=MAPS.indexOf(state.map);loadMap(MAPS[(i+1)%MAPS.length]);}

function hint(){
  const conf=conflicts();const a=state.map.adj;
  if(conf.length){state.hintRegion=conf[0][0];drawMap();setMsg('💡 閃動的區域旁邊，有一條紅色虛線：那兩區顏色一樣。試試把其中一區換色。','hint');return;}
  const total=Object.keys(a).length,done=Object.keys(state.colour).length;
  const pool=Object.keys(a).filter(r=>done===total||state.colour[r]===undefined);
  pool.sort((p,q)=>a[q].length-a[p].length);
  const r=pool[0];state.hintRegion=r;drawMap();
  if(done===total){
    setMsg('💡 這幅已完成了。想用少一點顏色？找一種只用在很少區域的顏色，看看那些區域可否換成其他已用的顏色。','hint');
  }else{
    setMsg(`💡 閃動的區域有 ${a[r].length} 個鄰居，鄰居最多。可以先想想它要用甚麼顏色，再著它旁邊的區域。`,'hint');
  }
}

/* ---------- 老師說明（χ 與四色定理只放這裏） ---------- */
function openTeacher(){
  const t=TEST.map(x=>`<tr><td>${LEVELS[x.level]}</td><td>${x.name}</td><td>${x.regions}</td><td><b>${x.computed}</b></td><td>${x.ok?'✅':'❌'}</td></tr>`).join('');
  openCard(`<div class="teacher"><h2>老師說明　第 5 節</h2>
  <h3>學習目標</h3>
  <ul>
    <li>理解「相鄰」＝共用一條邊；只接角不算。</li>
    <li>讓學生透過不斷嘗試，自己找出每幅地圖最少要用幾種顏色。</li>
    <li>學生頁<b>不會預先告知</b>目標色數，也不會寫「三色不夠／四色就夠」或四色定理。定理與每幅的 χ 只在本說明。</li>
    <li>培養策略：先處理鄰居多的區域、嘗試減少顏色。</li>
  </ul>
  <h3>四色定理（請勿在開始時告訴學生）</h3>
  <p>不論地圖怎樣畫（畫在平面上、每個區域連成一塊），最多用四種顏色就一定夠，可以令相鄰的區域顏色都不同。有些地圖 2 種或 3 種就夠，有些一定要 4 種，但從來不需要 5 種。這個發現叫做「四色定理」。嚴謹證明超出小學程度，課堂只作概念介紹，建議在學生充分嘗試之後，由老師口述揭示。</p>
  <h3>為何調色盤有 8 色、不限四色</h3>
  <p>若一開始限定四色，學生只是在「遵守規則」，失去自己發現「有時更少就夠、有時要較多」的機會。程式會顯示「你這次用了 N 種顏色」，完成後只邀請再試用更少顏色，不會對照最少色數，也不會因多用幾色而判錯。</p>
  <h3>每幅地圖的著色色數 χ（載入時程式以明確鄰接表自動驗證）</h3>
  <table class="t"><tr><th>程度</th><th>地圖</th><th>區域數</th><th>最少顏色 χ</th><th>自測</th></tr>${t}</table>
  <p>設計重點：「花朵村」中心有 4 個鄰居但 3 色已夠；「四國相連」四區兩兩相鄰（必須 4 色）；「五瓣花」「寶石群島」中心被 5 區圍成一圈（沒有四區兩兩相鄰，但仍需 4 色）；「切切切餅乾」區域多卻只需 2 色。以上重點請由老師掌握，不要寫在學生關卡名稱裏。</p>
  <h3>建議教法（50 分鐘）</h3>
  <ol>
    <li>（5'）只講規則：共邊不同色，接角不算。用「棋盤六國」示範接角。<b>不要一開始講四色定理，也不要告訴學生「這幅要用幾色」</b>。</li>
    <li>（15'）兩人一部 iPad 玩支援／基本層，記錄自己每幅「用了幾種」（只記自己的嘗試，不對照標準答案）。</li>
    <li>（10'）全班分享：哪幅你用得最少？誰能用更少顏色完成同一幅？有沒有怎樣試都好像少一種就不行的圖？先讓學生說，老師暫不公布 χ。</li>
    <li>（10'）挑戰層：鼓勵先找鄰居最多的區域。</li>
    <li>（10'）全班討論後，才由老師用本頁揭示四色定理，並可對照下表的 χ。</li>
  </ol>
  <h3>調難度</h3>
  <ul>
    <li>中下能力：只玩支援層 4 幅，再嘗試「四國相連」。</li>
    <li>能力較高：挑戰層，並要求「用盡可能少的顏色」完成，說明為什麼覺得不能更少（不必先給答案）。</li>
    <li>網址加 <code>?teacher=1</code> 會直接開啟此說明。</li>
  </ul>
  <h3>已知限制</h3>
  <ul>
    <li>地圖外形改為曲線／不規則邊界，看起來更像真正地圖；相鄰關係來自原圖的圖論結構（明確鄰接表），不是靠像素估計。</li>
    <li>進度只存在本頁記憶體，重新整理會清除；不收集任何個人資料，亦不連網。</li>
    <li>顏色以色塊及中文名稱區分，色覺辨認困難的學生可能需同伴協助。</li>
    <li>尚未在真實 iPad Safari 上實測觸控，上課前請用自己的 iPad 預演。</li>
  </ul>
  <div class="row"><button class="btn big" id="tClose">關閉</button></div></div>`);
  $('tClose').onclick=closeCard;
}

function openCard(html){$('ovCard').innerHTML=html;$('ov').classList.remove('hidden');$('ovCard').scrollTop=0;}
function closeCard(){$('ov').classList.add('hidden');}
function confetti(){const cs=PALETTE.map(p=>p.c);for(let i=0;i<28;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}}

/* ---------- 綁定 ---------- */
document.querySelectorAll('.lv[data-l]').forEach(b=>b.onclick=()=>{state.level=b.dataset.l;loadMap(MAPS.find(m=>m.level===state.level));});
$('hintBtn').onclick=hint;$('clearBtn').onclick=clearMap;$('nextBtn').onclick=nextMap;
$('teacherBtn').onclick=openTeacher;
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeCard();});
renderPalette();loadMap(MAPS[0]);
if(/[?&]teacher=1/.test(location.search)) openTeacher();
</script>
