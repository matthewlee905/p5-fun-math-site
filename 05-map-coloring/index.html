<script>
const LEVELS={support:'🌱 支援',basic:'⭐ 基本',challenge:'🔥 挑戰',expert:'🏅 專家'};
const PALETTE=[
 {c:'#ff6b6b',n:'紅'},{c:'#ffa94d',n:'橙'},{c:'#ffe066',n:'黃'},{c:'#69db7c',n:'綠'},
 {c:'#4dabf7',n:'藍'},{c:'#b197fc',n:'紫'},{c:'#f783ac',n:'粉紅'},{c:'#c08a5b',n:'棕'}
];
const UNCOLORED='#f7f1e6';
const ALPH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

function norm(raw){
  const adj={};
  const src=raw.adj;
  Object.keys(src).forEach(a=>{
    adj[String(a)]=(src[a]||[]).map(String);
  });
  const fixed={};
  Object.keys(raw.fixed||{}).forEach(k=>fixed[String(k)]=raw.fixed[k]);
  const centres={};
  Object.keys(raw.centres||{}).forEach(k=>centres[String(k)]=raw.centres[k]);
  const paths={};
  Object.keys(raw.paths||{}).forEach(k=>paths[String(k)]=raw.paths[k]);
  const chains=(raw.chains||[]).map((ch,i)=>({
    id:ch.id!=null?ch.id:i,
    a:intOrBorder(ch.a),
    b:intOrBorder(ch.b),
    frame:!!ch.frame,
    d:ch.d
  }));
  const regions=Object.keys(paths);
  return Object.assign({},raw,{adj,fixed,centres,paths,chains,regions,n:regions.length});
}
function intOrBorder(v){return (v===-1||v==="-1")?-1:String(v);}
const MAPS=(typeof MAP_DATA!=='undefined'?MAP_DATA:[]).map(norm);

function cellId(ch){return String(ALPH.indexOf(ch));}
function adjFromGrid(m){
  const rows=m.grid, gh=rows.length, gw=rows[0].length;
  const adj={};
  const add=(a,b)=>{if(a===b) return; (adj[a]||(adj[a]=new Set())).add(b); (adj[b]||(adj[b]=new Set())).add(a);};
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
    const a=cellId(rows[y][x]);
    if(x+1<gw) add(a, cellId(rows[y][x+1]));
    if(y+1<gh) add(a, cellId(rows[y+1][x]));
  }
  const out={};
  Object.keys(adj).forEach(k=>out[k]=[...adj[k]].sort((p,q)=>+p-+q));
  return out;
}
function sameAdj(a,b){
  const ka=Object.keys(a).sort(), kb=Object.keys(b).sort();
  if(ka.join()!==kb.join()) return false;
  return ka.every(k=> (a[k]||[]).slice().sort().join()===(b[k]||[]).slice().sort().join());
}
function isSymmetric(adj){
  for(const a in adj){
    if(adj[a].indexOf(a)!==-1) return false;
    for(const b of adj[a]) if(!adj[b]||adj[b].indexOf(a)===-1) return false;
  }
  return true;
}
function fillsGrid(m){
  if(!m.grid||!m.grid.length) return false;
  const ids=new Set(m.regions);
  const seen=new Set();
  for(const row of m.grid){
    if(row.length!==m.grid[0].length) return false;
    for(const ch of row){
      const i=ALPH.indexOf(ch);
      if(i<0||!ids.has(String(i))) return false;
      seen.add(String(i));
    }
  }
  return seen.size===ids.size && m.grid.length>0;
}
function pairId(a,b){return (+a)<(+b)?a+'|'+b:b+'|'+a;}
function cornerOnlyOk(m){
  /* pairs that share only a vertex must not be in adj */
  const rows=m.grid, gh=rows.length, gw=rows[0].length;
  const idAt=(x,y)=> (y>=0&&x>=0&&y<gh&&x<gw)?cellId(rows[y][x]):null;
  const verts=new Set();
  for(let y=0;y<=gh;y++) for(let x=0;x<=gw;x++){
    const ids=new Set();
    [[x-1,y-1],[x,y-1],[x-1,y],[x,y]].forEach(([cx,cy])=>{const c=idAt(cx,cy); if(c!==null) ids.add(c);});
    const arr=[...ids];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) verts.add(pairId(arr[i],arr[j]));
  }
  const edge=new Set();
  for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
    const a=idAt(x,y);
    if(x+1<gw){const b=idAt(x+1,y); if(a!==b) edge.add(pairId(a,b));}
    if(y+1<gh){const b=idAt(x,y+1); if(a!==b) edge.add(pairId(a,b));}
  }
  const adjset=new Set();
  for(const a in m.adj) for(const b of m.adj[a]) if((+a)<(+b)) adjset.add(a+'|'+b);
  for(const k of adjset) if(!edge.has(k)) return false;
  for(const k of verts){
    if(!edge.has(k) && adjset.has(k)) return false;
  }
  return true;
}
function colourable(adj,k,pre){
  const vs=Object.keys(adj).sort((p,q)=>adj[q].length-adj[p].length);
  const col=Object.assign({},pre||{});
  const ok=(v,c)=>{for(const u of adj[v]) if(col[u]===c) return false; return true;};
  const go=i=>{
    if(i===vs.length) return true;
    const v=vs[i];
    if(col[v]!==undefined) return go(i+1);
    for(let c=0;c<k;c++){ if(ok(v,c)){col[v]=c; if(go(i+1)) return true; delete col[v];} }
    return false;
  };
  return go(0)?col:null;
}
function chromatic(adj){for(let k=1;k<=4;k++) if(colourable(adj,k)) return k; return 99;}
function fixedConflict(m){
  const f=m.fixed;
  for(const a in f) for(const b of m.adj[a]||[]) if(f[b]!==undefined && f[b]===f[a]) return true;
  return false;
}
function regionConnected(m){
  const rows=m.grid; if(!rows||!rows.length) return false;
  const gh=rows.length, gw=rows[0].length;
  for(const rid of m.regions){
    let sx=-1,sy=-1,total=0;
    for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
      if(cellId(rows[y][x])===rid){ total++; if(sx<0){sx=x;sy=y;} }
    }
    if(total===0) return false;
    const seen=new Set();
    const q=[[sx,sy]]; seen.add(sx+','+sy);
    let cnt=0;
    while(q.length){
      const [x,y]=q.pop(); cnt++;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
        const nx=x+dx,ny=y+dy,k=nx+','+ny;
        if(nx<0||ny<0||nx>=gw||ny>=gh||seen.has(k)) return;
        if(cellId(rows[ny][nx])!==rid) return;
        seen.add(k); q.push([nx,ny]);
      });
    }
    if(cnt!==total) return false;
  }
  return true;
}
function chainsClosed(m){
  if(!m.chains||!m.chains.length) return false;
  for(const r of m.regions){
    const d=m.paths[r];
    if(!d||d.charAt(0)!=='M'||d.indexOf('Z')===-1) return false;
  }
  const covered=new Set();
  for(const ch of m.chains){
    if(!ch.d||ch.d.charAt(0)!=='M') return false;
    if(ch.a!==-1 && ch.b!==-1) covered.add(pairId(String(ch.a),String(ch.b)));
  }
  for(const a in m.adj) for(const b of m.adj[a]) if((+a)<(+b) && !covered.has(pairId(a,b))) return false;
  return true;
}
function selfTest(){
  return MAPS.map(m=>{
    const fromGrid=m.grid?adjFromGrid(m):null;
    const sym=isSymmetric(m.adj);
    const noSelf=Object.keys(m.adj).every(a=>m.adj[a].indexOf(a)===-1);
    const fill=fillsGrid(m);
    const corners=m.grid?cornerOnlyOk(m):false;
    const adjOk=!fromGrid||sameAdj(fromGrid,m.adj);
    const chi=chromatic(m.adj);
    const preOk=!fixedConflict(m);
    const sol4=colourable(m.adj,4,m.fixed);
    const pathsOk=m.regions.every(r=>m.paths[r]&&m.paths[r].indexOf('Z')!==-1);
    const conn=regionConnected(m);
    const chainsOk=chainsClosed(m);
    const ok=sym&&noSelf&&fill&&corners&&adjOk&&chi<=4&&preOk&&!!sol4&&pathsOk&&conn&&chainsOk;
    const issues=[];
    if(!sym) issues.push('不對稱'); if(!noSelf) issues.push('自鄰'); if(!fill) issues.push('未鋪滿');
    if(!corners) issues.push('只碰角被算相鄰'); if(!adjOk) issues.push('鄰接表與格子不符');
    if(chi>4) issues.push('超過四色'); if(!preOk) issues.push('預填衝突'); if(!sol4) issues.push('預填後無解');
    if(!pathsOk) issues.push('路徑缺失'); if(!conn) issues.push('區域不連通'); if(!chainsOk) issues.push('鏈未閉合或不覆蓋鄰接');
    return {id:m.id,name:m.name,level:m.level,regions:m.n,chi,fixed:Object.keys(m.fixed).length,minTouch:m.minTouchPx,ok,issues,solvable4:!!sol4,connected:conn,chainsOk:chainsOk,pixelOk:m.pixelOk!==false};
  });
}
const TEST=selfTest();
if(TEST.some(t=>!t.ok)) console.error('地圖自測失敗',TEST); else console.log('地圖自測全部通過',TEST);
window.MAP_TEST=TEST;

const state={level:'support',map:null,colour:{},notes:{},pick:0,best:{},hintRegion:null,errors:0,notesOn:false,timerOn:false,t0:0,tick:null,finished:false};

function viewBoxOf(m){return {x:0,y:0,w:m.W,h:m.H};}
function applySvgSize(s,m,minH){
  const vb=viewBoxOf(m);
  s.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  s.setAttribute('width', String(Math.round(vb.w)));
  s.setAttribute('height', String(Math.round(vb.h)));
  s.setAttribute('preserveAspectRatio','xMidYMid meet');
  s.style.aspectRatio = vb.w+' / '+vb.h;
  s.style.width='100%';
  s.style.height='auto';
  s.style.minHeight=(minH||280)+'px';
  s.style.maxHeight='70vh';
}
function drawThumb(m){
  const vb=viewBoxOf(m);
  const s=el('svg',{viewBox:vb.x+' '+vb.y+' '+vb.w+' '+vb.h,width:String(Math.round(vb.w/8)),height:String(Math.round(vb.h/8)),preserveAspectRatio:'xMidYMid meet'});
  s.style.aspectRatio=vb.w+' / '+vb.h;
  s.style.background=UNCOLORED;
  m.regions.forEach(r=>{
    const c=m.fixed[r];
    s.appendChild(el('path',{d:m.paths[r],fill:c!==undefined?PALETTE[c].c:UNCOLORED,stroke:'none','fill-rule':'nonzero'}));
  });
  (m.chains||[]).forEach(ch=>{
    s.appendChild(el('path',{d:ch.d,fill:'none',stroke:'#2b2d42','stroke-width':'5','stroke-linejoin':'round','stroke-linecap':'round'}));
  });
  return s;
}
function renderLevels(){
  document.querySelectorAll('.lv[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===state.level));
  const list=$('mapList');list.innerHTML='';
  MAPS.filter(m=>m.level===state.level).forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='mc'+(state.map&&state.map.id===m.id?' on':'');
    b.type='button';
    const cap=document.createElement('span');cap.textContent=m.name;
    b.appendChild(drawThumb(m));b.appendChild(cap);
    if(state.best[m.id]){const d=document.createElement('span');d.className='done';d.textContent='已完成';b.appendChild(d);}
    b.onclick=()=>loadMap(m);
    list.appendChild(b);
  });
}
function renderPalette(){
  const box=$('palette');box.innerHTML='';
  PALETTE.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='sw'+(state.pick===i?' on':'');
    b.style.background=c.c;b.textContent=c.n;b.setAttribute('aria-label',c.n);
    b.onclick=()=>{state.pick=i;renderPalette();};
    box.appendChild(b);
  });
}
function conflicts(){
  const a=state.map.adj, out=[];
  for(const r in a) for(const n of a[r]) if((+r)<(+n) && state.colour[r]!==undefined && state.colour[r]===state.colour[n]) out.push([r,n]);
  return out;
}
function usedColours(){
  return [...new Set(Object.keys(state.colour).filter(r=>state.colour[r]!==undefined).map(r=>state.colour[r]))].sort((p,q)=>p-q);
}
function isFixed(r){return state.map.fixed[r]!==undefined;}

function drawMap(){
  const m=state.map,s=$('map');
  if(!m||!s) return;
  applySvgSize(s,m,280);
  s.innerHTML='';
  const conf=conflicts();
  const confSet=new Set();conf.forEach(([a,b])=>{confSet.add(a);confSet.add(b);});
  m.regions.forEach(r=>{
    const c=state.colour[r];
    const p=el('path',{d:m.paths[r],class:'region'+(isFixed(r)?' fixed':''),'data-r':r,fill:c!==undefined?PALETTE[c].c:UNCOLORED,'fill-rule':'nonzero'});
    s.appendChild(p);
  });
  confSet.forEach(r=>{
    s.appendChild(el('path',{d:m.paths[r],class:'region-outline','fill-rule':'nonzero'}));
  });
  const confKeys=new Set(conf.map(([a,b])=>pairId(a,b)));
  (m.chains||[]).forEach(ch=>{
    const key=(ch.a===-1||ch.b===-1)?'':pairId(String(ch.a),String(ch.b));
    s.appendChild(el('path',{d:ch.d,class:'chain'+(key&&confKeys.has(key)?' conflict':'')}));
  });
  if(state.hintRegion&&m.paths[state.hintRegion]){
    s.appendChild(el('path',{d:m.paths[state.hintRegion],class:'pulse-outline'}));
  }
  m.regions.forEach(r=>{
    const notes=state.notes[r]||[];
    const [cx,cy]=m.centres[r]||[0,0];
    notes.forEach((ci,i)=>{
      const ang=(i- (notes.length-1)/2)*14;
      s.appendChild(el('circle',{class:'note-dot',cx:String(cx+ang),cy:String(cy+18),r:'8',fill:PALETTE[ci].c}));
    });
  });
  Object.keys(m.fixed).forEach(r=>{
    const [cx,cy]=m.centres[r]||[0,0];
    s.appendChild(el('circle',{class:'fix-dot',cx:String(cx),cy:String(cy),r:'10'}));
  });
  updateStatus(conf);
}

function updateStatus(conf){
  const u=usedColours();$('nUsed').textContent=u.length;
  const d=$('usedDots');d.innerHTML='';u.forEach(i=>{const e=document.createElement('i');e.style.background=PALETTE[i].c;d.appendChild(e);});
  const total=state.map.regions.length, done=Object.keys(state.colour).length;
  $('prog').textContent=`已著色 ${done} / ${total} 個區域`+(conf&&conf.length?`　｜　相鄰同色：${conf.length} 處`:'');
  $('nErr').textContent=String(state.errors);
}

function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'');}

function tapRegion(r){
  if(!state.map||state.pick===undefined) return;
  state.hintRegion=null;
  if(isFixed(r)){setMsg('這個區域是起點（有白點），不能改顏色。','hint');drawMap();return;}
  if(state.notesOn){
    const arr=state.notes[r]?state.notes[r].slice():[];
    const i=arr.indexOf(state.pick);
    if(i>=0) arr.splice(i,1); else arr.push(state.pick);
    state.notes[r]=arr;drawMap();setMsg('已更新筆記標記。打開或關閉「筆記」都可以。');return;
  }
  const before=conflicts().length;
  if(state.colour[r]===state.pick) delete state.colour[r];
  else state.colour[r]=state.pick;
  const conf=conflicts();
  if(conf.length>before) state.errors+=1;
  drawMap();
  const total=state.map.regions.length, done=Object.keys(state.colour).length;
  if(conf.length) setMsg('有相鄰區域顏色相同，已用紅色標示。請改其中一區。','warn');
  else if(done===total) finish();
  else setMsg(`很好！還有 ${total-done} 個區域未著色。`);
}

function finish(){
  if(state.finished) return;
  state.finished=true;
  const n=usedColours().length;
  state.best[state.map.id]=Math.min(state.best[state.map.id]||99,n);
  renderLevels();confetti();
  setMsg(`🎉 完成！你這次用了 ${n} 種顏色。`,'ok');
  openCard(`<h2>🎉 完成了！</h2>
   <p>你這次用了 <span class="big-n">${n}</span> 種顏色完成！</p>
   <p>做得好！若想再挑戰，可以試試能不能用更少顏色再著一次。</p>
   <div class="row"><button class="btn clear big" id="cRetry">🔄 再試一次（保留起點）</button>
   <button class="btn next big" id="cNext">➡️ 下一幅</button></div>`);
  $('cRetry').onclick=()=>{closeCard();clearMap();};
  $('cNext').onclick=()=>{closeCard();nextMap();};
}

function resetPlay(keepBest){
  const m=state.map;
  state.colour={};state.notes={};state.hintRegion=null;state.errors=0;state.finished=false;
  if(m) Object.keys(m.fixed).forEach(r=>{state.colour[r]=m.fixed[r];});
  state.t0=Date.now();
  updateTimer();
}
function clearMap(){resetPlay();drawMap();setMsg('已清除（起點顏色仍保留）。再試一次吧！可以試試用更少的顏色。');}
function nextMap(){
  const pool=MAPS.filter(m=>m.level===state.level);
  const i=pool.indexOf(state.map);
  loadMap(pool[(i+1)%pool.length]);
}
function loadMap(m){
  state.map=m;resetPlay();
  $('mapTitle').textContent=`${LEVELS[m.level]}：${m.name}`;
  renderLevels();drawMap();
  setMsg('先選一種顏色，再點地圖上的區域。有白點的是起點，不能改。');
}

function hint(){
  const conf=conflicts();const a=state.map.adj;
  if(conf.length){state.hintRegion=conf[0][0];drawMap();setMsg('💡 閃動的區域旁邊有紅色標記：那兩區顏色一樣。試試把其中一區換色。','hint');return;}
  const total=Object.keys(a).length, done=Object.keys(state.colour).length;
  const pool=Object.keys(a).filter(r=>!isFixed(r)&&(done===total||state.colour[r]===undefined));
  pool.sort((p,q)=>a[q].length-a[p].length);
  const r=pool[0];if(!r){setMsg('💡 起點已經填好，其餘區域也可開始著色。','hint');return;}
  state.hintRegion=r;drawMap();
  if(done===total) setMsg('💡 這幅已完成了。想用少一點顏色？找一種只用在很少區域的顏色，看看那些區域可否換成其他已用的顏色。','hint');
  else setMsg(`💡 閃動的區域有 ${a[r].length} 個鄰居，鄰居比較多。可以先想想它要用甚麼顏色。`,'hint');
}

function updateTimer(){
  if(!state.timerOn) return;
  const s=Math.floor((Date.now()-state.t0)/1000);
  const mm=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  $('timer').textContent=mm+':'+ss;
}

function openTeacher(){
  const t=TEST.map(x=>`<tr><td>${LEVELS[x.level]}</td><td>${x.name}</td><td>${x.regions}</td><td><b>${x.chi}</b></td><td>${x.fixed}</td><td>${x.minTouch}</td><td>${x.ok?'✅':'❌'}${x.issues&&x.issues.length?' '+x.issues.join('、'):''}${x.pixelOk===false?' 像素未過':''}</td></tr>`).join('');
  openCard(`<div class="teacher"><h2>老師說明　第 5 節</h2>
  <h3>學習目標</h3>
  <p>學生頁：『我能夠按規則嘗試和調整，找出用最少顏色完成的方法。』</p>
  <h3>任務目的（學生頁）</h3>
  <p>① 為每個區域著色：共用一條邊的兩個區域，顏色要不同；只碰到一個角，不算相鄰。<br>② 把整幅地圖都塗好，就算完成。再試試看，能不能用更少顏色再做一次。</p>
  <ul>
    <li>理解「相鄰」＝共用一條邊；只接角不算。</li>
    <li>讓學生透過不斷嘗試，自己找出每幅地圖最少要用幾種顏色。</li>
    <li>學生頁<b>不會預先告知</b>目標色數，也不會寫「三色不夠／四色就夠」或四色定理。定理與每幅的 χ 只在本說明。</li>
    <li>部分區域預先填色（白點標記、不可改）作為起點。學生可開關計時，也可用「筆記」在區內標記可能的顏色。</li>
  </ul>
  <h3>四色定理（請勿在開始時告訴學生）</h3>
  <p>不論地圖怎樣畫（畫在平面上、每個區域連成一塊），最多用四種顏色就一定夠，可以令相鄰的區域顏色都不同。有些地圖 2 種或 3 種就夠，有些一定要 4 種，但從來不需要 5 種。這個發現叫做「四色定理」。嚴謹證明超出小學程度，課堂只作概念介紹，建議在學生充分嘗試之後，由老師口述揭示。</p>
  <h3>為何調色盤有 8 色、不限四色</h3>
  <p>若一開始限定四色，學生只是在「遵守規則」，失去自己發現「有時更少就夠、有時要較多」的機會。程式會顯示「你這次用了 N 種顏色」，完成後只邀請再試用更少顏色，不會對照最少色數，也不會因多用幾色而判錯。</p>
  <h3>每幅地圖的著色色數 χ（載入時程式自動驗證：鏈拼接閉合、每區連通、鄰接對稱、只碰角不算、預填無衝突且最多四色可解；像素檢查以格子中心取樣，結果見下表）</h3>
  <table class="t"><tr><th>程度</th><th>地圖</th><th>區域數</th><th>最少顏色 χ</th><th>預填</th><th>最小觸控</th><th>自測</th></tr>${t}</table>
  <h3>建議教法（50 分鐘）</h3>
  <ol>
    <li>（5'）只講規則：共邊不同色，接角不算。<b>不要一開始講四色定理，也不要告訴學生「這幅要用幾色」</b>。</li>
    <li>（15'）兩人一部 iPad 玩支援／基本層，記錄自己每幅「用了幾種」（只記自己的嘗試，不對照標準答案）。</li>
    <li>（10'）全班分享：哪幅你用得最少？誰能用更少顏色完成同一幅？有沒有怎樣試都好像少一種就不行的圖？先讓學生說，老師暫不公布 χ。</li>
    <li>（10'）挑戰或專家層：鼓勵先找鄰居最多的區域。</li>
    <li>（10'）全班討論後，才由老師用本頁揭示四色定理，並可對照下表的 χ。</li>
  </ol>
  <h3>調難度</h3>
  <ul>
    <li>中下能力：只玩支援層，利用預填起點。</li>
    <li>能力較高：挑戰或專家層，並要求「用盡可能少的顏色」完成，說明為什麼覺得不能更少（不必先給答案）。</li>
    <li>網址加 <code>?teacher=1</code> 會直接開啟此說明。</li>
  </ul>
  <h3>已知限制</h3>
  <ul>
    <li>地圖為完全鋪滿的長方框。區域由細格子合併（每區連通、大小相近）；格頂點以固定種子輕微抖動（邊框點只沿邊框移動，四角不動）。邊界拆成連結點之間的共用鏈，每條鏈只平滑一次；填色 path 由這些鏈拼成，描邊只畫一次每條鏈，因此無縫隙、無重疊。相鄰＝共用至少一條格邊，只碰一角不算。白點與筆記點在區域內部遠離邊界的格子中心。</li>
    <li>進度只存在本頁記憶體，重新整理會清除；不收集任何個人資料，亦不連網。</li>
    <li>顏色以色塊及中文名稱區分，色覺辨認困難的學生可能需同伴協助。</li>
    <li>尚未在真實 iPad Safari 上實測觸控，上課前請用自己的 iPad 預演。</li>
  </ul>
  <div class="row"><button class="btn big" id="tClose">關閉</button></div></div>`);
  $('tClose').onclick=closeCard;
}
function openCard(html){$('ovCard').innerHTML=html;$('ov').classList.remove('hidden');$('ovCard').scrollTop=0;}
function closeCard(){$('ov').classList.add('hidden');}
function confetti(){const cs=PALETTE.map(p=>p.c);for(let i=0;i<28;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}}

document.querySelectorAll('.lv[data-l]').forEach(b=>b.onclick=()=>{state.level=b.dataset.l;loadMap(MAPS.find(m=>m.level===state.level));});
$('hintBtn').onclick=hint;$('clearBtn').onclick=clearMap;$('nextBtn').onclick=nextMap;
$('teacherBtn').onclick=openTeacher;
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeCard();});
$('togTimer').onchange=()=>{
  state.timerOn=$('togTimer').checked;
  $('timerBox').classList.toggle('hidden',!state.timerOn);
  if(state.timerOn){if(!state.t0) state.t0=Date.now();updateTimer(); if(!state.tick) state.tick=setInterval(updateTimer,500);}
};
$('togNotes').onchange=()=>{state.notesOn=$('togNotes').checked; setMsg(state.notesOn?'筆記模式已開啟：點區域可標記或取消現在選的顏色。':'已關閉筆記模式，點區域會填色。');};
$('map').addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest('.region');
  if(!t) return;
  e.preventDefault();
  tapRegion(t.getAttribute('data-r'));
});

renderPalette();
loadMap(MAPS.find(m=>m.level==='support')||MAPS[0]);
if(/[?&]teacher=1/.test(location.search)) openTeacher();
window._map={MAPS,loadMap,state,drawMap,TEST};
</script>
